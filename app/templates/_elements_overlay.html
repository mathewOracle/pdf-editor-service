{% for el in elements %}
  {% if el.kind == "text" %}
  {% if el.redact_x0_frac is not none %}
  <div class="redact-cover"
       style="left: {{ el.redact_x0_frac * 100 }}%; top: {{ el.redact_y0_frac * 100 }}%;
              width: {{ (el.redact_x1_frac - el.redact_x0_frac) * 100 }}%;
              height: {{ (el.redact_y1_frac - el.redact_y0_frac) * 100 }}%;"></div>
  {% endif %}
  <div
    id="el-{{ el.id }}"
    class="overlay-el text{% if not el.text %} removed{% endif %}"
    style="left: {{ el.x_frac * 100 }}%; top: {{ el.y_frac * 100 }}%; font-size: calc({{ (el.font_size * 100 / page_width_pt) }} * 1cqw); color: {{ el.color }};"
    onmousedown="startDrag(event, {{ el.id }})"
    ondblclick="startInlineEdit(event, {{ el.document_id }}, {{ el.id }}, {{ el.page_number }})"
    title="Drag to move, double-click to edit"
  ><span class="el-text">{{ el.text or "" }}</span><span class="remove-btn" onclick="removeElement(event, {{ el.document_id }}, {{ el.id }}, {{ el.page_number }})" title="Remove (restores original text)">x</span></div>
  {% else %}
  {% set asset = assets_by_id[el.asset_id] %}
  <div
    id="el-{{ el.id }}"
    class="overlay-el"
    style="left: {{ el.x_frac * 100 }}%; top: {{ el.y_frac * 100 }}%; width: {{ (el.width_frac or 0.25) * 100 }}%;"
    onmousedown="startDrag(event, {{ el.id }})"
  >
    <img src="/documents/{{ el.document_id }}/assets/{{ asset.id }}/file" draggable="false" />
    <span class="remove-btn" onclick="removeElement(event, {{ el.document_id }}, {{ el.id }}, {{ el.page_number }})">x</span>
  </div>
  {% endif %}
{% endfor %}
